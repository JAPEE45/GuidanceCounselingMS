<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment - Guidance Counseling System</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="../../assets/styles/components/sidebar.css">
    <link rel="stylesheet" href="../../assets/styles/layouts/stud-book-appointment.css">
  </head>
  <body>
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h4><i class="fas fa-graduation-cap"></i> Guidance Counseling</h4>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="./dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        </li>
        <li>
          <a href="#" class="active"
            ><i class="fas fa-calendar-check"></i> Book Appointment</a
          >
        </li>
        <li>
          <a href="./notifications.html"><i class="fas fa-bell"></i> Notification</a>
        </li>
        <li>
          <a href="./profile.html"><i class="fas fa-user"></i> Profile</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <div class="top-header">
        <div class="student-info">
          <div>
            <h2 id="studentName">Juan Dela Cruz</h2>
            <div class="student-details">
              <span><strong>Age:</strong> <span id="studentAge">20</span></span>
              <span
                ><strong>Course & Year:</strong>
                <span id="studentCourse"
                  >BS Computer Science - 3rd Year</span
                ></span
              >
            </div>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-bar-custom">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
      </div>

      <!-- Form -->
      <form id="appointmentForm">
        <!-- Physical Wellness Section -->
        <div class="form-container mb-4">
          <div class="section-header">
            <i class="fas fa-heartbeat"></i>
            <h3>Physical Wellness</h3>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">1.</span> Can you describe your
              routine physical activities?
            </label>
            <textarea
              class="form-control"
              name="physical_q1"
              required
              placeholder="Describe your routine physical activities..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">2.</span> Do you exercise? If so,
              how often?
            </label>
            <textarea
              class="form-control"
              name="physical_q2"
              required
              placeholder="Describe your exercise routine..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">3.</span> How will you describe your
              daily food intake?
            </label>
            <textarea
              class="form-control"
              name="physical_q3"
              required
              placeholder="Describe your daily food intake..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">4.</span> Do you follow certain
              types of dietary plan? What nutritional meal do you often eat?
            </label>
            <textarea
              class="form-control"
              name="physical_q4"
              required
              placeholder="Describe your dietary plan and nutritional meals..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">5.</span> How often do you eat a
              day? In what time do you eat your meals?
            </label>
            <textarea
              class="form-control"
              name="physical_q5"
              required
              placeholder="Describe your meal frequency and timing..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">6.</span> How many hours do you
              sleep in a day?
            </label>
            <input
              type="text"
              class="form-control"
              name="physical_q6"
              required
              placeholder="e.g., 7-8 hours"
            />
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">7.</span> What is the time of your
              waking up and sleeping hour?
            </label>
            <input
              type="text"
              class="form-control"
              name="physical_q7"
              required
              placeholder="e.g., Sleep at 10 PM, Wake up at 6 AM"
            />
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">8.</span> How would you describe
              your sleep (sound and good sleep or shallow sleep)?
            </label>
            <textarea
              class="form-control"
              name="physical_q8"
              required
              placeholder="Describe the quality of your sleep..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">9.</span> Do you smoke, drink, or
              take drugs? If so, how often and since when?
            </label>
            <textarea
              class="form-control"
              name="physical_q9"
              required
              placeholder="Please answer honestly for proper guidance..."
            ></textarea>
          </div>
        </div>

        <!-- Intellectual Wellness Section -->
        <div class="form-container mb-4">
          <div class="section-header">
            <i class="fas fa-brain"></i>
            <h3>Intellectual Wellness</h3>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">1.</span> What are your strengths in
              terms of your knowledge, abilities, and skills?
            </label>
            <textarea
              class="form-control"
              name="intellectual_q1"
              required
              placeholder="Describe your strengths..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">2.</span> How do you use these
              strengths in your daily tasks?
            </label>
            <textarea
              class="form-control"
              name="intellectual_q2"
              required
              placeholder="Describe how you apply your strengths..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">3.</span> Describe your academic
              performance.
            </label>
            <textarea
              class="form-control"
              name="intellectual_q3"
              required
              placeholder="Describe your academic performance..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">4.</span> How do you enhance your
              knowledge, abilities, and skills?
            </label>
            <textarea
              class="form-control"
              name="intellectual_q4"
              required
              placeholder="Describe how you improve yourself..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">5.</span> If there are potentials
              that still need to be enhanced, what are those?
            </label>
            <textarea
              class="form-control"
              name="intellectual_q5"
              required
              placeholder="Describe areas for improvement..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">6.</span> Is there weakness that you
              would like to be improved? What weakness?
            </label>
            <textarea
              class="form-control"
              name="intellectual_q6"
              required
              placeholder="Describe weaknesses you'd like to improve..."
            ></textarea>
          </div>
        </div>

        <!-- Environmental Wellness Section -->
        <div class="form-container mb-4">
          <div class="section-header">
            <i class="fas fa-home"></i>
            <h3>Environmental Wellness</h3>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">1.</span> How will you describe your
              home recently?
            </label>
            <textarea
              class="form-control"
              name="environmental_q1"
              required
              placeholder="Describe your home environment..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">2.</span> How will you describe your
              boarding house recently?
            </label>
            <textarea
              class="form-control"
              name="environmental_q2"
              placeholder="Describe your boarding house (if applicable)..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">3.</span> Can you describe your
              classroom situation?
            </label>
            <textarea
              class="form-control"
              name="environmental_q3"
              required
              placeholder="Describe your classroom environment..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">4.</span> Do you feel safe and
              secure in your home/boarding house/classroom?
            </label>
            <textarea
              class="form-control"
              name="environmental_q4"
              required
              placeholder="Describe how safe you feel..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">5.</span> Do you often feel that
              your environment motivates you to pursue your daily tasks and
              achieve your goal? How?
            </label>
            <textarea
              class="form-control"
              name="environmental_q5"
              required
              placeholder="Describe how your environment motivates you..."
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">
              <span class="question-number">6.</span> Can you feel that your
              environment provides care and allows you to be who you are? How?
            </label>
            <textarea
              class="form-control"
              name="environmental_q6"
              required
              placeholder="Describe how your environment supports you..."
            ></textarea>
          </div>
        </div>

        <!-- Submit Buttons -->
        <div class="form-container">
          <div class="d-flex gap-3 justify-content-end">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="resetForm()"
            >
              <i class="fas fa-redo"></i> Reset Form
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-paper-plane"></i> Submit Appointment
            </button>
          </div>
        </div>
      </form>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/components/sidebar.js"></script>
    <script src="../../assets/scripts/stud-book-appointment.js"></script>
  </body>
</html>
