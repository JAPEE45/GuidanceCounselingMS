<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - Guidance Counseling System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../../assets/styles/components/sidebar.css" />

    <link
      rel="stylesheet"
      href="../../assets/styles/layouts/stud-notifications.css"
    />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h4><i class="fas fa-graduation-cap"></i> Guidance Counseling</h4>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="./dashboard.html" class=""><i class="fas fa-home"></i> Dashboard</a>
        </li>
        <li>
          <a href="./book-appointment.html" class=""
            ><i class="fas fa-calendar-check"></i> Book Appointment</a
          >
        </li>
        <li>
          <a href="#" class="active"><i class="fas fa-bell"></i> Notification</a>
        </li>
        <li>
          <a href="./profile.html"><i class="fas fa-user"></i> Profile</a>
        </li>
        <li>
          <a href="../../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </li>
      </ul>
    </aside>

    <!-- Mobile Toggle -->
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Page Header -->
      <div class="page-header">
        <h2><i class="fas fa-bell"></i> Notifications</h2>
        <div class="header-actions">
          <button class="btn-custom" onclick="markAllAsRead()">
            <i class="fas fa-check-double"></i> Mark All as Read
          </button>
        </div>
      </div>

      <!-- Notifications Container -->
      <div class="notifications-container">
        <div class="notifications-header">
          <h5>Recent Notifications</h5>
          <div class="filter-buttons">
            <button
              class="filter-btn active"
              onclick="filterNotifications('all')"
            >
              All
            </button>
            <button class="filter-btn" onclick="filterNotifications('unread')">
              Unread
            </button>
            <button class="filter-btn" onclick="filterNotifications('pending')">
              Pending
            </button>
          </div>
        </div>

        <div id="notificationsList">
          <!-- Notifications will be loaded here -->
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/components/sidebar.js"></script>
    <script src="../../assets/scripts/stud-notifications.js"></script>
  </body>
</html>
