    <link rel="stylesheet" href="../../assets/styles/layouts/admin-notifications.css">
  </head>
  <body>

        <li>
          <a href="./counselors.html" class=""><i class="fas fa-user-tie"></i> Counselors</a>
        </li>

            ><i class="fa-solid fa-calendar-check"></i> Appointments</a

    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <h2><i class="fas fa-bell"></i> Notifications & Referrals</h2>
        <p>Track updates, reminders, and manage student referrals</p>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs" id="notificationTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="new-tab"
            data-bs-toggle="tab"
            data-bs-target="#new"
            type="button"
          >
            <i class="fas fa-star"></i> New Appointment Requests
            <span class="badge bg-danger ms-2" id="newCount">3</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pending-tab"
            data-bs-toggle="tab"
            data-bs-target="#pending"
            type="button"
          >
            <i class="fas fa-clock"></i> Pending Appointments
            <span class="badge bg-warning ms-2" id="pendingCount">5</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="referrals-tab"
            data-bs-toggle="tab"
            data-bs-target="#referrals"
            type="button"
          >
            <i class="fas fa-exchange-alt"></i> Pending Referrals
            <span class="badge bg-info ms-2" id="referralsCount">2</span>
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content" id="notificationTabsContent">
        <!-- New Appointment Requests -->
        <div class="tab-pane fade show active" id="new" role="tabpanel">
          <div id="newAppointments"></div>
        </div>

        <!-- Pending Appointments -->
        <div class="tab-pane fade" id="pending" role="tabpanel">
          <div id="pendingAppointments"></div>
        </div>

        <!-- Pending Referrals -->
        <div class="tab-pane fade" id="referrals" role="tabpanel">
          <div id="pendingReferrals"></div>
        </div>
      </div>
    </div>

    <!-- Assign Counselor Modal -->
    <div class="modal fade" id="assignCounselorModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-user-plus"></i> Assign Counselor
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>Student:</strong> <span id="modalStudentName"></span></p>
            <p><strong>Concern:</strong> <span id="modalConcern"></span></p>
            <hr />
            <h6 class="mb-3">Select a Counselor:</h6>
            <div id="counselorList"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-assign"
              onclick="confirmAssignment()"
            >
              Confirm Assignment
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal fade" id="viewDetailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-info-circle"></i> Appointment Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="detailsModalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/components/sidebar.js"></script>
    <script src="../../assets/scripts/admin-notifications.js"></script>
  </body>
</html>
