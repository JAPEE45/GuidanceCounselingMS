      href="../../assets/styles/layouts/counselor-dashboard.css"
    />
  </head>
  <body>

        <li>
          <a href="./counselors.html" class=""><i class="fas fa-calendar-alt"></i> My Schedule</a>
        </li>

          <a href="#" class="nav-link" onclick="toggleSubmenu(event)">

            <i
              class="fas fa-chevron-down ms-auto"

            ></i>

            <a href="#" class="nav-link">

        <li>
          <a href="./appointments.html"
            ><i class="fas fa-clipboard-list"></i> Session Management</a
          >

        <li>
          <a href="./notifications.html" class="notif-referrals"
            ><i class="fas fa-user-graduate"></i> Student Record</a

      </ul>
    </aside>
    
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <h2><i class="fas fa-chart-line"></i> Counselor Dashboard</h2>
        <!-- <div class="user-info">
          <div>
            <strong style="color: var(--navy-blue)">Dr. Sarah Martinez</strong>
            <p style="margin: 0; font-size: 12px; color: #6c757d">
              Guidance Counselor
            </p>
          </div>
          <div class="user-avatar">SM</div>
        </div> -->
      </div>

      <!-- Stats Cards -->
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-icon schedule">
            <i class="fas fa-calendar-check"></i>
          </div>
          <div class="stat-info">
            <h3 id="todaySchedules">8</h3>
            <p>Today's Schedules</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon sessions">
            <i class="fas fa-comments"></i>
          </div>
          <div class="stat-info">
            <h3 id="totalSessions">156</h3>
            <p>Total Sessions</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon students">
            <i class="fas fa-users"></i>
          </div>
          <div class="stat-info">
            <h3 id="totalStudents">42</h3>
            <p>Total Students</p>
          </div>
        </div>
      </div>

      <!-- Upcoming Appointments -->
      <div class="appointments-section">
        <div class="section-header">
          <h3><i class="fas fa-clock"></i> Upcoming Appointments</h3>
          <span style="color: #6c757d; font-size: 14px"
            >Next 3 appointments</span
          >
        </div>
        <div id="appointmentsList"></div>
        <button class="see-more-btn" onclick="navigateToSchedule()">
          See More Appointments <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <div class="modal fade" id="appointmentModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-info-circle"></i> Appointment Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="modalContent"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/components/sidebar.js"></script>
    <script src="../../assets/scripts/counselor-dashboard.js"></script>
  </body>
