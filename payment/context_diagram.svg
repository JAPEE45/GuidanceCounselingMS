<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Central Process (GCMS) -->
  <circle cx="400" cy="300" r="100" fill="white" stroke="black" stroke-width="3"/>
  <text x="400" y="290" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Guidance Counseling</text>
  <text x="400" y="315" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Management System</text>
  <text x="400" y="340" font-family="Arial" font-size="16" text-anchor="middle">(GCMS)</text>
  
  <!-- Entity: Student -->
  <rect x="50" y="250" width="150" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="125" y="305" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">STUDENT</text>
  
  <!-- Entity: Counselor -->
  <rect x="600" y="100" width="150" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="675" y="155" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">COUNSELOR</text>
  
  <!-- Entity: Administrator -->
  <rect x="600" y="400" width="150" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="675" y="455" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">ADMIN</text>
  
  <!-- Arrows & Labels: Student -> System -->
  <path d="M 200 280 L 300 280" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="255" font-family="Arial" font-size="12" text-anchor="middle">Credentials, Booking Req,</text>
  <text x="250" y="270" font-family="Arial" font-size="12" text-anchor="middle">Wellness Data</text>
  
  <!-- Arrows & Labels: System -> Student -->
  <path d="M 300 320 L 200 320" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="340" font-family="Arial" font-size="12" text-anchor="middle">Notifications,</text>
  <text x="250" y="355" font-family="Arial" font-size="12" text-anchor="middle">Appt Status</text>
  
  <!-- Arrows & Labels: Counselor -> System -->
  <path d="M 600 180 L 480 250" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="560" y="210" font-family="Arial" font-size="12" text-anchor="start" transform="rotate(-30, 560, 210)">Session Notes, Status Update</text>
  
  <!-- Arrows & Labels: System -> Counselor -->
  <path d="M 460 220 L 600 140" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="180" font-family="Arial" font-size="12" text-anchor="start" transform="rotate(-30, 500, 180)">Student Records, Schedules</text>
  
  <!-- Arrows & Labels: Admin -> System -->
  <path d="M 600 420 L 480 350" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="560" y="390" font-family="Arial" font-size="12" text-anchor="start" transform="rotate(30, 560, 390)">User Data, Config</text>
  
  <!-- Arrows & Labels: System -> Admin -->
  <path d="M 480 380 L 600 460" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="420" font-family="Arial" font-size="12" text-anchor="start" transform="rotate(30, 500, 420)">Reports, Activity Logs</text>
  
  <!-- Arrowhead Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>
</svg>
